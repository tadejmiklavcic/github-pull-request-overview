<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pull Request Overview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#20252b;font:14px system-ui,sans-serif}header{background:white;border-bottom:1px solid #dce0e4;padding:24px 32px}h1{font-size:24px;margin:0 0 20px}form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;font-size:12px;color:#525b65}select,input,button{font:inherit;border:1px solid #bfc7cf;border-radius:5px;padding:9px 12px;background:white;color:#20252b}button{background:#167647;color:white;border-color:#167647;cursor:pointer}button:disabled{opacity:.5;cursor:wait}main{padding:24px 32px;max-width:1600px}.toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}#search{width:320px;max-width:100%}h2{font-size:17px;margin:24px 0 10px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce0e4;vertical-align:top}th{font-size:12px;color:#606a74}a{color:#0969a5;text-decoration:none}a:hover{text-decoration:underline}.table{overflow:auto}.badge{font-size:12px;font-weight:600;white-space:nowrap}.ready{color:#167647}.changes{color:#b32934}.feedback{color:#176baf}.waiting{color:#916413}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;background:#edf0f3;padding:14px;font-size:12px}#error{color:#b32934}#summary{align-self:center;color:#525b65}td{overflow-wrap:anywhere}td:first-child{min-width:160px}details{margin-bottom:20px}@media(max-width:650px){header,main{padding:18px}table{min-width:780px}form label{width:100%}h1{font-size:22px}}
</style></head><body><header><h1>Pull Request Overview</h1><form id="scan"><label>View<select id="mode"><option value="review">Needs my review</option><option value="mine">My PRs awaiting approval</option><option value="all">All open PRs</option><option value="ready">At least 2 approvals</option></select></label><label>GitHub login<input id="login" placeholder="Authenticated user" autocomplete="off"></label><button id="run" type="submit">↻ Scan repositories</button></form></header><main><div class="toolbar"><span id="summary">No scan yet</span><input id="search" type="search" placeholder="Search tickets, repos, titles" aria-label="Search PRs"></div><p id="error" role="alert"></p><details id="progress"><summary>Scan progress</summary><pre id="logs"></pre></details><div id="results"></div></main>
<script>
let report=null;let active=false;let previousReport='';
const $=id=>document.getElementById(id);
const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=pr=>/^https:\/\/github\.com\//.test(pr.url)?escape(pr.url):'#';
function render(){
 if(!report)return;
 const search=$('search').value.toLowerCase();let count=0;
 $('results').innerHTML=report.groups.map(group=>{
 const prs=group.pull_requests.filter(pr=>[group.ticket,pr.repo,pr.title,pr.author].join(' ').toLowerCase().includes(search));count+=prs.length;if(!prs.length)return '';
 return `<section><h2>${escape(group.ticket)}</h2><div class="table"><table><thead><tr><th>Status</th><th>Pull request</th><th>Repository</th><th>Approvals</th><th>Approvers</th></tr></thead><tbody>${prs.map(pr=>{const status=pr.has_changes_requested?['changes','Changes requested']:pr.has_unresolved_feedback?['feedback','Waiting for feedback']:pr.has_min_approvals?['ready','Ready']:['waiting','Waiting for approvals'];return `<tr><td><span class="badge ${status[0]}">${status[1]}</span></td><td><a target="_blank" rel="noopener noreferrer" href="${link(pr)}">#${pr.number} ${escape(pr.title)}</a></td><td>${escape(pr.repo)}</td><td>${pr.approvals}/${report.minimum_approvals}</td><td>${escape((pr.approving_reviewers||[]).join(', ')||'None')}</td></tr>`}).join('')}</tbody></table></div></section>`}).join('')||'<p>No matching pull requests.</p>';
 $('summary').textContent=`${count} PR entries · ${report.groups.length} ticket groups`;
 $('error').textContent=(report.errors||[]).map(e=>`${e.repo}: ${e.error}`).join('\n');
}
async function poll(){try{const response=await fetch('/api/state');if(!response.ok)throw Error('Cannot read scan status');const state=await response.json();active=state.running;$('run').disabled=active;$('run').textContent=active?'Scanning…':'↻ Scan repositories';$('logs').textContent=state.logs.join('');if(active){$('progress').open=true;$('summary').textContent='Scanning repositories…';}if(state.error)$('error').textContent=state.error;const serialized=JSON.stringify(state.report);if(state.report&&serialized!==previousReport){previousReport=serialized;report=state.report;render();}}catch(error){$('error').textContent=error.message;}finally{setTimeout(poll,1000)}}
 $('scan').onsubmit=async event=>{event.preventDefault();$('error').textContent='';$('run').disabled=true;try{const response=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('mode').value,login:$('login').value})});const result=await response.json();if(!response.ok)throw Error(result.error);previousReport='';$('progress').open=true;}catch(error){$('error').textContent=error.message;$('run').disabled=false;}};
 $('search').oninput=render;poll();
</script></body></html>
